<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arab Spring Intervention Matrix</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Georgia, serif; background:#1a1714; color:#e8e0d4; padding:16px; }
.wrap { max-width:1000px; margin:0 auto; }
h1 { font-size:22px; color:#c4956a; border-bottom:2px solid #c4956a; padding-bottom:10px; margin-bottom:4px; }
.sub { font-size:12px; color:#8a7e70; margin-bottom:16px; }
.tabs { display:flex; gap:4px; margin-bottom:20px; }
.tab { padding:8px 14px; border:1px solid #3a342e; border-radius:4px; background:none; color:#8a7e70; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; }
.tab.on { background:#c4956a; color:#1a1714; border-color:#c4956a; }
.panel { display:none; }
.panel.on { display:block; }
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { padding:8px 4px; font-size:10px; color:#5a524a; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid #3a342e; text-align:center; }
.tbl td { padding:8px 4px; border-bottom:1px solid #2a2420; text-align:center; }
.tbl th:first-child, .tbl td:first-child { text-align:left; }
.tbl tr:hover { background:#2a2420; cursor:pointer; }
.cell { display:inline-block; width:32px; height:32px; line-height:32px; border-radius:4px; font-weight:bold; font-size:13px; text-align:center; }
.badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:10px; font-weight:bold; text-transform:uppercase; color:#1a1714; letter-spacing:0.3px; }
.sel-bar { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:16px; }
.sel-btn { padding:5px 10px; border:1px solid #3a342e; border-radius:4px; background:none; color:#8a7e70; font-size:11px; cursor:pointer; }
.sel-btn.on { border-color:#c4956a; background:#2a2420; color:#c4956a; font-weight:bold; }
.card { padding:14px; background:#221f1b; border:1px solid #3a342e; border-radius:6px; margin-bottom:16px; }
.card h3 { font-size:11px; color:#8a7e70; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; }
.row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px; color:#c4b89a; }
.row input[type=range] { width:50%; height:5px; -webkit-appearance:none; appearance:none; background:#2a2420; border-radius:3px; outline:none; cursor:pointer; }
.row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#c4956a; }
.val { font-weight:bold; min-width:16px; text-align:right; color:#c4956a; font-size:13px; }
.out-btn { display:block; width:100%; padding:8px; border:2px solid #3a342e; border-radius:4px; background:none; color:#8a7e70; font-size:12px; font-weight:600; text-align:left; cursor:pointer; margin-bottom:5px; }
textarea { width:100%; min-height:100px; padding:8px; border:1px solid #3a342e; border-radius:4px; background:#1a1714; color:#c4b89a; font-family:Georgia,serif; font-size:13px; line-height:1.5; resize:vertical; outline:none; }
.stats { display:flex; flex-wrap:wrap; gap:16px; padding:12px; background:#221f1b; border:1px solid #3a342e; border-radius:6px; }
.stat-label { font-size:9px; color:#5a524a; text-transform:uppercase; letter-spacing:0.8px; }
.stat-val { font-size:18px; font-weight:bold; color:#c4956a; }
.scatter { position:relative; height:300px; background:#1a1714; border:1px solid #3a342e; border-radius:6px; overflow:hidden; margin-bottom:16px; }
.dot { position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; transform:translate(-50%,-50%); color:#e8e0d4; }
.gridh { position:absolute; left:100px; right:8px; height:1px; background:#2a2420; }
.ylabel { position:absolute; left:4px; font-size:8px; white-space:nowrap; }
.xlabel { position:absolute; bottom:4px; left:50%; transform:translateX(-50%); font-size:9px; color:#5a524a; white-space:nowrap; }
.note { font-size:12px; color:#5a524a; font-style:italic; margin-top:8px; }
.analysis { font-size:13px; color:#c4b89a; line-height:1.7; }
.analysis b { color:#c4956a; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media(max-width:600px) { .g2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
<h1>Arab Spring Intervention Matrix</h1>
<p class="sub">Measuring foreign intervention impact on outcomes across 8 countries</p>
<div class="tabs">
<button class="tab on" id="t0" onclick="go(0)">Heatmap</button>
<button class="tab" id="t1" onclick="go(1)">Country Detail</button>
<button class="tab" id="t2" onclick="go(2)">Correlation</button>
</div>
<div class="panel on" id="p0"></div>
<div class="panel" id="p1"></div>
<div class="panel" id="p2"></div>
</div>
<script>
var C=[
{id:"tunisia",n:"Tunisia"},
{id:"egypt",n:"Egypt"},
{id:"libya",n:"Libya"},
{id:"syria",n:"Syria"},
{id:"yemen",n:"Yemen"},
{id:"bahrain",n:"Bahrain"},
{id:"morocco",n:"Morocco"},
{id:"jordan",n:"Jordan"}
];
var IT=[
{id:"military",l:"Direct military",d:"Air strikes, ground troops"},
{id:"proxy",l:"Proxy / covert",d:"Arms, training, intel"},
{id:"diplomatic",l:"Diplomatic",d:"Sanctions, UN resolutions"},
{id:"financial",l:"Financial",d:"Aid, loans, investment"},
{id:"media",l:"Media / info",d:"State media, narrative"}
];
var AC=[
{id:"us",l:"United States",c:"#3B5998"},
{id:"eu",l:"EU / France / UK",c:"#1D4ED8"},
{id:"russia",l:"Russia",c:"#B91C1C"},
{id:"saudi",l:"Saudi / UAE",c:"#15803D"},
{id:"qatar",l:"Qatar",c:"#7C2D12"},
{id:"turkey",l:"Turkey",c:"#DC2626"},
{id:"iran",l:"Iran",c:"#4C1D95"},
{id:"un",l:"UN / Arab League",c:"#0369A1"}
];
var OC=[
{id:"democratic",l:"Democratic transition",c:"#16a34a",v:4},
{id:"partial",l:"Partial reform",c:"#ca8a04",v:3},
{id:"restoration",l:"Authoritarian restoration",c:"#ea580c",v:2},
{id:"collapse",l:"State collapse",c:"#dc2626",v:1}
];
var HC=["#1a1714","#2d2520","#4a3520","#7a5530","#a8753a","#c4956a"];
var D={
tunisia:{o:"democratic",s:{military:0,proxy:0,diplomatic:2,financial:2,media:1},a:{us:1,eu:2,russia:0,saudi:1,qatar:2,turkey:1,iran:0,un:1},t:"Minimal foreign military involvement. EU/Qatar provided diplomatic/financial support. Ennahda received Gulf backing."},
egypt:{o:"restoration",s:{military:0,proxy:1,diplomatic:3,financial:4,media:3},a:{us:3,eu:2,russia:1,saudi:4,qatar:3,turkey:2,iran:1,un:1},t:"Saudi/UAE bankrolled Sisi coup with $12B+ in aid. Qatar backed Morsi. U.S. suspended then restored aid."},
libya:{o:"collapse",s:{military:5,proxy:4,diplomatic:3,financial:2,media:2},a:{us:4,eu:5,russia:1,saudi:2,qatar:4,turkey:3,iran:0,un:3},t:"NATO air campaign (UNSCR 1973). Qatar/France armed rebels. Post-Gaddafi vacuum filled by competing militias."},
syria:{o:"collapse",s:{military:5,proxy:5,diplomatic:3,financial:3,media:4},a:{us:4,eu:2,russia:5,saudi:4,qatar:4,turkey:5,iran:5,un:2},t:"Maximum intervention from all sides. Russia/Iran backed Assad. Gulf/Turkey armed opposition. U.S. armed Kurds."},
yemen:{o:"collapse",s:{military:5,proxy:5,diplomatic:2,financial:3,media:3},a:{us:3,eu:1,russia:0,saudi:5,qatar:2,turkey:1,iran:4,un:2},t:"Saudi-led coalition airstrikes from 2015. Iran backed Houthis. U.S. provided intelligence and logistics."},
bahrain:{o:"restoration",s:{military:4,proxy:1,diplomatic:1,financial:3,media:2},a:{us:2,eu:1,russia:0,saudi:5,qatar:0,turkey:0,iran:2,un:0},t:"Saudi/GCC Peninsula Shield crushed protests. U.S. Fifth Fleet based there - muted response."},
morocco:{o:"partial",s:{military:0,proxy:0,diplomatic:1,financial:2,media:1},a:{us:1,eu:2,russia:0,saudi:2,qatar:1,turkey:0,iran:0,un:0},t:"Minimal intervention. Gulf financial backstop. Monarchy co-opted Feb 20 movement with reform."},
jordan:{o:"partial",s:{military:0,proxy:0,diplomatic:1,financial:3,media:1},a:{us:2,eu:1,russia:0,saudi:3,qatar:1,turkey:0,iran:0,un:0},t:"Gulf/U.S. financial aid stabilized monarchy. IMF conditionality shaped reform pace."}
};
var W={military:1,proxy:1,diplomatic:1,financial:1,media:1};
var sel="tunisia";
var cur=0;

function wt(id){var c=D[id];if(!c)return 0;var s=0,w=0;for(var i=0;i<IT.length;i++){s+=c.s[IT[i].id]*W[IT[i].id];w+=W[IT[i].id];}return w>0?s/w:0;}
function at(id){var c=D[id];if(!c)return 0;var s=0;for(var i=0;i<AC.length;i++){s+=c.a[AC[i].id];}return s;}
function da(id){var c=D[id];if(!c)return”-”;var mx=0,b=””;for(var i=0;i<AC.length;i++){if(c.a[AC[i].id]>mx){mx=c.a[AC[i].id];b=AC[i].l;}}return b||”-”;}
function bg(oid){for(var i=0;i<OC.length;i++){if(OC[i].id===oid)return’<span class="badge" style="background:'+OC[i].c+'">’+OC[i].l+’</span>’;}return””;}

function go(n){
cur=n;
for(var i=0;i<3;i++){
document.getElementById(“t”+i).className=i===n?“tab on”:“tab”;
document.getElementById(“p”+i).className=i===n?“panel on”:“panel”;
}
draw();
}

function draw(){
if(cur===0)d0();
else if(cur===1)d1();
else d2();
}

function d0(){
var h=’<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Country</th>’;
for(var j=0;j<IT.length;j++){h+=’<th>’+IT[j].l+’</th>’;}
h+=’<th>Weighted</th><th>Outcome</th></tr></thead><tbody>’;
for(var i=0;i<C.length;i++){
var c=C[i],d=D[c.id],w=wt(c.id);
h+=’<tr onclick="sel=\''+c.id+'\';go(1)">’;
h+=’<td style="font-weight:600">’+c.n+’</td>’;
for(var j=0;j<IT.length;j++){
var v=d.s[IT[j].id],fg=v>=3?”#1a1714”:”#c4956a”;
h+=’<td><span class="cell" style="background:'+HC[v]+';color:'+fg+'">’+v+’</span></td>’;
}
h+=’<td style="font-weight:700;color:'+(w>=3?'#c4956a':'#8a7e70')+'">’+w.toFixed(1)+’</td>’;
h+=’<td>’+bg(d.o)+’</td></tr>’;
}
h+=’</tbody></table></div>’;
h+=’<div class="card" style="margin-top:16px"><h3>Variable weights</h3>’;
for(var j=0;j<IT.length;j++){
var t=IT[j];
h+=’<div class="row"><span>’+t.l+’</span><input type="range" min="0" max="3" value="'+W[t.id]+'" oninput="W[\''+t.id+'\']=parseInt(this.value);this.nextElementSibling.textContent=this.value;draw()"><span class="val">’+W[t.id]+’</span></div>’;
}
h+=’</div>’;
h+=’<p class="note">Tap any row for full country breakdown.</p>’;
document.getElementById(“p0”).innerHTML=h;
}

function d1(){
var c=D[sel];
var h=’<div class="sel-bar">’;
for(var i=0;i<C.length;i++){
h+=’<button class="sel-btn'+(sel===C[i].id?' on':'')+'" onclick="sel=\''+C[i].id+'\';draw()">’+C[i].n+’</button>’;
}
h+=’</div><div class="g2">’;
h+=’<div class="card"><h3>Intervention scores (0-5)</h3>’;
for(var j=0;j<IT.length;j++){
var t=IT[j],v=c.s[t.id];
h+=’<div class="row"><span>’+t.l+’</span><input type="range" min="0" max="5" value="'+v+'" oninput="D[\''+sel+'\'].s[\''+t.id+'\']=parseInt(this.value);this.nextElementSibling.textContent=this.value"><span class="val">’+v+’</span></div>’;
}
h+=’</div>’;
h+=’<div class="card"><h3>Actor involvement (0-5)</h3>’;
for(var j=0;j<AC.length;j++){
var a=AC[j],v=c.a[a.id];
h+=’<div class="row"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+a.c+';margin-right:5px;vertical-align:middle"></span>’+a.l+’</span><input type="range" min="0" max="5" value="'+v+'" oninput="D[\''+sel+'\'].a[\''+a.id+'\']=parseInt(this.value);this.nextElementSibling.textContent=this.value"><span class="val">’+v+’</span></div>’;
}
h+=’</div></div>’;
h+=’<div class="g2">’;
h+=’<div class="card"><h3>Outcome</h3>’;
for(var j=0;j<OC.length;j++){
var o=OC[j],on=c.o===o.id;
h+=’<button class="out-btn" style="border-color:'+(on?o.c:'#3a342e')+';color:'+(on?o.c:'#8a7e70')+';background:'+(on?o.c+'22':'none')+'" onclick="D[\''+sel+'\'].o=\''+o.id+'\';draw()">’+o.l+’</button>’;
}
h+=’</div>’;
h+=’<div class="card"><h3>Notes</h3><textarea oninput="D[\''+sel+'\'].t=this.value">’+c.t+’</textarea></div>’;
h+=’</div>’;
var tw=wt(sel),ta=at(sel),td=da(sel);
h+=’<div class="stats">’;
h+=’<div><div class="stat-label">Weighted</div><div class="stat-val">’+tw.toFixed(1)+’</div></div>’;
h+=’<div><div class="stat-label">Actors</div><div class="stat-val">’+ta+’</div></div>’;
h+=’<div><div class="stat-label">Dominant</div><div class="stat-val" style="font-size:13px">’+td+’</div></div>’;
h+=’<div><div class="stat-label">Outcome</div><div>’+bg(c.o)+’</div></div>’;
h+=’</div>’;
document.getElementById(“p1”).innerHTML=h;
}

function d2(){
var pts=[];
for(var i=0;i<C.length;i++){
var ov=0;for(var j=0;j<OC.length;j++){if(OC[j].id===D[C[i].id].o)ov=OC[j].v;}
pts.push({id:C[i].id,n:C[i].n,int:wt(C[i].id),act:at(C[i].id),o:D[C[i].id].o,ov:ov});
}
var h=’<div class="card"><h3>Intervention vs. outcome</h3>’;
h+=’<p style="font-size:12px;color:#8a7e70;margin-bottom:12px">X = intervention score. Y = outcome (4=democracy, 1=collapse). Size = actor involvement.</p>’;
h+=’<div class="scatter">’;
var labels=[{l:“Collapse”,c:”#dc2626”,v:1},{l:“Restoration”,c:”#ea580c”,v:2},{l:“Reform”,c:”#ca8a04”,v:3},{l:“Democracy”,c:”#16a34a”,v:4}];
for(var i=0;i<labels.length;i++){
var top=((3-i)/3)*70+12;
h+=’<div class="ylabel" style="top:'+top+'%;color:'+labels[i].c+'">’+labels[i].l+’</div>’;
h+=’<div class="gridh" style="top:'+top+'%"></div>’;
}
for(var i=0;i<pts.length;i++){
var p=pts[i];
var xp=12+(p.int/5)*80;
var yp=((4-p.ov)/3)*70+12;
var sz=18+p.act*2;
var col=”#8a7e70”;for(var j=0;j<OC.length;j++){if(OC[j].id===p.o)col=OC[j].c;}
h+=’<div class="dot" style="left:'+xp+'%;top:'+yp+'%;width:'+sz+'px;height:'+sz+'px;background:'+col+'33;border:2px solid '+col+'">’+p.n.substring(0,3)+’</div>’;
}
h+=’<div class="xlabel">Low intervention –– High intervention</div>’;
h+=’</div></div>’;

pts.sort(function(a,b){return b.int-a.int;});
var hi=[],lo=[];
for(var i=0;i<pts.length;i++){if(pts[i].int>=3)hi.push(pts[i]);if(pts[i].int<2)lo.push(pts[i]);}
var hin=[],lon=[];
for(var i=0;i<hi.length;i++)hin.push(hi[i].n);
for(var i=0;i<lo.length;i++)lon.push(lo[i].n);
var hiAll=true;for(var i=0;i<hi.length;i++){if(hi[i].ov>2)hiAll=false;}
var loAll=true;for(var i=0;i<lo.length;i++){if(lo[i].ov<3)loAll=false;}

h+=’<div class="card"><h3>Key patterns</h3><div class="analysis">’;
h+=’<p><b>High intervention (’+hin.join(”, “)+’):</b> ‘;
h+=hiAll?‘All produced collapse or authoritarian restoration.’:‘Mixed outcomes despite heavy involvement.’;
h+=’</p><p><b>Low intervention (’+lon.join(”, “)+’):</b> ‘;
h+=loAll?‘All achieved reform or democratic transition.’:‘Mixed results even with minimal involvement.’;
h+=’</p><p><b>Actor pattern:</b> Saudi/UAE dominance correlates with authoritarian restoration. Russia/Iran dominance correlates with prolonged war. Tunisia - the only democratic success - had no dominant external actor.</p>’;
h+=’</div></div>’;

h+=’<div class="card"><h3>Ranked by intervention</h3><table class="tbl"><thead><tr><th>#</th><th>Country</th><th>Score</th><th>Actors</th><th>Outcome</th></tr></thead><tbody>’;
for(var i=0;i<pts.length;i++){
var p=pts[i];
h+=’<tr><td>’+(i+1)+’</td><td style="font-weight:600">’+p.n+’</td><td style="font-weight:700;color:#c4956a">’+p.int.toFixed(1)+’</td><td>’+p.act+’</td><td>’+bg(p.o)+’</td></tr>’;
}
h+=’</tbody></table></div>’;
document.getElementById(“p2”).innerHTML=h;
}

draw();
</script>

</body>
</html>
