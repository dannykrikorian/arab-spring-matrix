<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arab Spring Intervention Matrix — HNC12</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Newsreader', Georgia, serif; background: #1a1714; color: #e8e0d4; min-height: 100vh; padding: 20px 16px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .container { max-width: 1100px; margin: 0 auto; }

/* Header */
.header { border-bottom: 2px solid #c4956a; padding-bottom: 12px; margin-bottom: 8px; }
.header h1 { font-size: 26px; font-weight: 700; color: #c4956a; letter-spacing: -0.5px; line-height: 1.15; }
.header p { font-size: 13px; color: #8a7e70; margin-top: 6px; font-family: ‘JetBrains Mono’, monospace; letter-spacing: 0.3px; }

/* Nav */
.nav { display: flex; gap: 4px; margin-top: 12px; margin-bottom: 28px; }
.nav-btn { padding: 7px 16px; border: 1px solid #3a342e; border-radius: 4px; background: transparent; color: #8a7e70; font-family: ‘JetBrains Mono’, monospace; font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.15s; }
.nav-btn.active { border-color: #c4956a; background: #c4956a; color: #1a1714; }

/* Cards */
.card { padding: 16px; background: #221f1b; border-radius: 8px; border: 1px solid #3a342e; }
.card-title { margin: 0 0 14px; font-size: 13px; font-family: ‘JetBrains Mono’, monospace; color: #8a7e70; text-transform: uppercase; letter-spacing: 1px; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th { padding: 8px 6px; font-size: 10px; font-family: ‘JetBrains Mono’, monospace; color: #5a524a; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid #3a342e; text-align: center; font-weight: 600; }
td { padding: 10px 6px; font-size: 14px; border-bottom: 1px solid #2a2420; text-align: center; }
th.left, td.left { text-align: left; }
tr.clickable { cursor: pointer; transition: background 0.15s; }
tr.clickable:hover { background: #2a2420; }

/* Heat cells */
.heat-cell { width: 36px; height: 36px; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-family: ‘JetBrains Mono’, monospace; font-size: 14px; font-weight: 700; }

/* Outcome badges */
.badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #1a1714; font-family: ‘JetBrains Mono’, monospace; }

/* Sliders */
.slider-row { margin-bottom: 10px; }
.slider-row label { display: flex; justify-content: space-between; margin-bottom: 2px; }
.slider-row label span { font-size: 13px; color: #c4b89a; }
.slider-row label .desc { font-size: 10px; color: #5a524a; font-family: ‘JetBrains Mono’, monospace; }
.slider-wrap { display: flex; align-items: center; gap: 8px; }
.slider-wrap input[type=range] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; border-radius: 3px; outline: none; cursor: pointer; background: #2a2420; }
.slider-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #c4956a; cursor: pointer; }
.slider-val { font-family: ‘JetBrains Mono’, monospace; font-size: 13px; min-width: 18px; text-align: right; font-weight: 600; }

/* Country selector */
.country-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.country-btn { padding: 6px 12px; border: 1px solid #3a342e; border-radius: 4px; background: transparent; color: #8a7e70; font-family: ‘JetBrains Mono’, monospace; font-size: 12px; cursor: pointer; font-weight: 400; transition: all 0.15s; }
.country-btn.active { border-color: #c4956a; background: #2a2420; color: #c4956a; font-weight: 700; }

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

/* Outcome buttons */
.outcome-btn { display: block; width: 100%; padding: 8px 12px; border: 2px solid #3a342e; border-radius: 6px; background: transparent; color: #8a7e70; font-family: ‘JetBrains Mono’, monospace; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left; margin-bottom: 6px; transition: all 0.15s; }

/* Notes textarea */
.notes-area { width: 100%; min-height: 140px; padding: 10px; border: 1px solid #3a342e; border-radius: 6px; background: #1a1714; color: #c4b89a; font-family: ‘Newsreader’, serif; font-size: 14px; line-height: 1.5; resize: vertical; outline: none; }

/* Stat boxes */
.stat-row { display: flex; gap: 24px; flex-wrap: wrap; padding: 16px; background: #221f1b; border-radius: 8px; border: 1px solid #3a342e; margin-top: 20px; }
.stat-box .stat-label { font-size: 10px; color: #5a524a; font-family: ‘JetBrains Mono’, monospace; text-transform: uppercase; letter-spacing: 1px; }
.stat-box .stat-value { font-size: 20px; font-weight: 700; color: #c4956a; font-family: ‘JetBrains Mono’, monospace; }

/* Actor dot */
.actor-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* Scatter plot */
.scatter-container { position: relative; height: 340px; border: 1px solid #3a342e; border-radius: 6px; overflow: hidden; background: #1a1714; }
.scatter-ylabel { position: absolute; left: 4px; font-size: 9px; font-family: ‘JetBrains Mono’, monospace; white-space: nowrap; }
.scatter-gridline { position: absolute; left: 130px; right: 10px; height: 1px; background: #2a2420; }
.scatter-point { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); z-index: 2; cursor: default; }
.scatter-xlabel { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #5a524a; font-family: ‘JetBrains Mono’, monospace; white-space: nowrap; }

/* Analysis text */
.analysis p { margin: 0 0 10px; font-size: 14px; color: #c4b89a; line-height: 1.7; }
.analysis strong { color: #c4956a; }

.view-section { display: none; }
.view-section.active { display: block; }

/* Weight controls */
.weight-panel { margin-top: 24px; }
.weight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.weight-grid label span { font-size: 12px; color: #8a7e70; font-family: ‘JetBrains Mono’, monospace; }

.hint { font-size: 12px; color: #5a524a; margin-top: 12px; font-style: italic; }
.overflow-x { overflow-x: auto; }
</style>

</head>
<body>

<div class="container">
  <div class="header">
    <h1>Arab Spring Intervention Matrix</h1>
    <p>Measuring foreign intervention impact on outcomes across 8 countries</p>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchView('matrix')">Heatmap</button>
    <button class="nav-btn" onclick="switchView('country')">Country Detail</button>
    <button class="nav-btn" onclick="switchView('correlation')">Correlation</button>
  </div>

  <div id="view-matrix" class="view-section active"></div>
  <div id="view-country" class="view-section"></div>
  <div id="view-correlation" class="view-section"></div>
</div>

<script>
const COUNTRIES = [
  { id: "tunisia", name: "Tunisia", flag: "\u{1F1F9}\u{1F1F3}" },
  { id: "egypt", name: "Egypt", flag: "\u{1F1EA}\u{1F1EC}" },
  { id: "libya", name: "Libya", flag: "\u{1F1F1}\u{1F1FE}" },
  { id: "syria", name: "Syria", flag: "\u{1F1F8}\u{1F1FE}" },
  { id: "yemen", name: "Yemen", flag: "\u{1F1FE}\u{1F1EA}" },
  { id: "bahrain", name: "Bahrain", flag: "\u{1F1E7}\u{1F1ED}" },
  { id: "morocco", name: "Morocco", flag: "\u{1F1F2}\u{1F1E6}" },
  { id: "jordan", name: "Jordan", flag: "\u{1F1EF}\u{1F1F4}" },
];

const INTERVENTION_TYPES = [
  { id: "military", label: "Direct military", desc: "Air strikes, ground troops, naval blockade" },
  { id: "proxy", label: "Proxy / covert", desc: "Arms, training, intelligence to non-state actors" },
  { id: "diplomatic", label: "Diplomatic pressure", desc: "Sanctions, UN resolutions, mediation" },
  { id: "financial", label: "Financial leverage", desc: "Aid conditionality, loans, investment" },
  { id: "media", label: "Media / information", desc: "State media influence, narrative shaping" },
];

const ACTORS = [
  { id: "us", label: "United States", color: "#3B5998" },
  { id: "eu", label: "EU / France / UK", color: "#1D4ED8" },
  { id: "russia", label: "Russia", color: "#B91C1C" },
  { id: "saudi", label: "Saudi Arabia / UAE", color: "#15803D" },
  { id: "qatar", label: "Qatar", color: "#7C2D12" },
  { id: "turkey", label: "Turkey", color: "#DC2626" },
  { id: "iran", label: "Iran", color: "#4C1D95" },
  { id: "un", label: "UN / Arab League", color: "#0369A1" },
];

const OUTCOMES = [
  { id: "democratic", label: "Democratic transition", color: "#16a34a", value: 4 },
  { id: "partial", label: "Partial reform", color: "#ca8a04", value: 3 },
  { id: "restoration", label: "Authoritarian restoration", color: "#ea580c", value: 2 },
  { id: "collapse", label: "State collapse / civil war", color: "#dc2626", value: 1 },
];

const HEAT_COLORS = ["#1a1714", "#2d2520", "#4a3520", "#7a5530", "#a8753a", "#c4956a"];

let data = {
  tunisia: { outcome: "democratic", scores: { military: 0, proxy: 0, diplomatic: 2, financial: 2, media: 1 }, actors: { us: 1, eu: 2, russia: 0, saudi: 1, qatar: 2, turkey: 1, iran: 0, un: 1 }, notes: "Minimal foreign military involvement. EU/Qatar provided diplomatic/financial support to transition. Ennahda received Gulf backing." },
  egypt: { outcome: "restoration", scores: { military: 0, proxy: 1, diplomatic: 3, financial: 4, media: 3 }, actors: { us: 3, eu: 2, russia: 1, saudi: 4, qatar: 3, turkey: 2, iran: 1, un: 1 }, notes: "Saudi/UAE bankrolled Sisi coup with $12B+ in aid. Qatar backed Morsi. U.S. suspended then restored aid. No direct military intervention but massive financial leverage." },
  libya: { outcome: "collapse", scores: { military: 5, proxy: 4, diplomatic: 3, financial: 2, media: 2 }, actors: { us: 4, eu: 5, russia: 1, saudi: 2, qatar: 4, turkey: 3, iran: 0, un: 3 }, notes: "NATO air campaign (UNSCR 1973). Qatar/France armed rebels. Post-Gaddafi vacuum filled by competing militias backed by rival external sponsors." },
  syria: { outcome: "collapse", scores: { military: 5, proxy: 5, diplomatic: 3, financial: 3, media: 4 }, actors: { us: 4, eu: 2, russia: 5, saudi: 4, qatar: 4, turkey: 5, iran: 5, un: 2 }, notes: "Maximum external intervention from all sides. Russia/Iran militarily backed Assad. Gulf states/Turkey armed opposition. U.S. armed Kurds. Proxy war layered on civil war." },
  yemen: { outcome: "collapse", scores: { military: 5, proxy: 5, diplomatic: 2, financial: 3, media: 3 }, actors: { us: 3, eu: 1, russia: 0, saudi: 5, qatar: 2, turkey: 1, iran: 4, un: 2 }, notes: "Saudi-led coalition airstrikes from 2015. Iran backed Houthis with arms/advisors. U.S. provided intelligence and logistics. Humanitarian catastrophe." },
  bahrain: { outcome: "restoration", scores: { military: 4, proxy: 1, diplomatic: 1, financial: 3, media: 2 }, actors: { us: 2, eu: 1, russia: 0, saudi: 5, qatar: 0, turkey: 0, iran: 2, un: 0 }, notes: "Saudi/GCC Peninsula Shield force entered March 2011 to crush protests. U.S. Fifth Fleet based in Bahrain \u2014 muted response. Iran accused of backing Shia protesters." },
  morocco: { outcome: "partial", scores: { military: 0, proxy: 0, diplomatic: 1, financial: 2, media: 1 }, actors: { us: 1, eu: 2, russia: 0, saudi: 2, qatar: 1, turkey: 0, iran: 0, un: 0 }, notes: "Minimal external intervention. Gulf states provided financial backstop. Monarchy co-opted Feb 20 movement with constitutional reform. France maintained close ties." },
  jordan: { outcome: "partial", scores: { military: 0, proxy: 0, diplomatic: 1, financial: 3, media: 1 }, actors: { us: 2, eu: 1, russia: 0, saudi: 3, qatar: 1, turkey: 0, iran: 0, un: 0 }, notes: "Gulf/U.S. financial aid stabilized Hashemite monarchy. No military intervention. IMF conditionality shaped reform pace. Refugee crisis from Syria increased leverage of donors." },
};

let weights = { military: 1, proxy: 1, diplomatic: 1, financial: 1, media: 1 };
let selectedCountry = "tunisia";
let currentView = "matrix";

function weightedTotal(cid) {
  const c = data[cid]; if (!c) return 0;
  let s = 0, w = 0;
  INTERVENTION_TYPES.forEach(t => { s += c.scores[t.id] * weights[t.id]; w += weights[t.id]; });
  return w > 0 ? s / w : 0;
}

function actorTotal(cid) {
  const c = data[cid]; if (!c) return 0;
  return Object.values(c.actors).reduce((a, b) => a + b, 0);
}

function dominantActor(cid) {
  const c = data[cid]; if (!c) return "\u2014";
  let max = -1, best = "";
  Object.entries(c.actors).forEach(([k, v]) => { if (v > max) { max = v; best = k; } });
  return ACTORS.find(a => a.id === best)?.label || "\u2014";
}

function badgeHTML(outcomeId) {
  const o = OUTCOMES.find(x => x.id === outcomeId);
  if (!o) return "";
  return `<span class="badge" style="background:${o.color}">${o.label}</span>`;
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['matrix','country','correlation'][i] === v);
  });
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  render();
}

function render() {
  if (currentView === 'matrix') renderMatrix();
  else if (currentView === 'country') renderCountry();
  else if (currentView === 'correlation') renderCorrelation();
}

function renderMatrix() {
  let html = '<div class="overflow-x"><table style="min-width:700px"><thead><tr><th class="left" style="width:120px">Country</th>';
  INTERVENTION_TYPES.forEach(t => { html += `<th title="${t.desc}">${t.label}</th>`; });
  html += '<th>Weighted total</th><th>Outcome</th></tr></thead><tbody>';

  COUNTRIES.forEach(c => {
    const d = data[c.id];
    const wt = weightedTotal(c.id);
    html += `<tr class="clickable" onclick="selectedCountry='${c.id}';switchView('country')">`;
    html += `<td class="left" style="font-weight:600">${c.flag} ${c.name}</td>`;
    INTERVENTION_TYPES.forEach(t => {
      const v = d.scores[t.id];
      const fg = v >= 3 ? '#1a1714' : '#c4956a';
      html += `<td><div class="heat-cell" style="background:${HEAT_COLORS[v]};color:${fg}">${v}</div></td>`;
    });
    const wtColor = wt >= 3 ? '#c4956a' : '#8a7e70';
    html += `<td><span class="mono" style="font-size:15px;font-weight:700;color:${wtColor}">${wt.toFixed(1)}</span></td>`;
    html += `<td>${badgeHTML(d.outcome)}</td></tr>`;
  });

  html += '</tbody></table></div>';

  // Weight controls
  html += '<div class="card weight-panel"><h3 class="card-title">Variable weights</h3><div class="weight-grid">';
  INTERVENTION_TYPES.forEach(t => {
    html += `<div><span class="mono" style="font-size:12px;color:#8a7e70">${t.label}</span>`;
    html += `<div class="slider-wrap"><input type="range" min="0" max="3" value="${weights[t.id]}" oninput="weights['${t.id}']=parseInt(this.value);this.nextElementSibling.textContent=this.value;render()" style="background:linear-gradient(to right,#c4956a ${(weights[t.id]/3)*100}%,#2a2420 ${(weights[t.id]/3)*100}%)"><span class="slider-val" style="color:${weights[t.id]>0?'#c4956a':'#5a524a'}">${weights[t.id]}</span></div></div>`;
  });
  html += '</div></div>';
  html += '<p class="hint">Click any country row for full breakdown. Adjust weights to test which intervention types matter most.</p>';

  document.getElementById('view-matrix').innerHTML = html;
}

function renderCountry() {
  const c = data[selectedCountry];
  const meta = COUNTRIES.find(x => x.id === selectedCountry);

  let html = '<div class="country-selector">';
  COUNTRIES.forEach(x => {
    html += `<button class="country-btn ${selectedCountry===x.id?'active':''}" onclick="selectedCountry='${x.id}';render()">${x.flag} ${x.name}</button>`;
  });
  html += '</div>';

  html += '<div class="grid-2">';

  // Intervention scores
  html += '<div class="card"><h3 class="card-title">Intervention type scores (0\u20135)</h3>';
  INTERVENTION_TYPES.forEach(t => {
    const v = c.scores[t.id];
    html += `<div class="slider-row"><label><span>${t.label}</span><span class="desc">${t.desc}</span></label>`;
    html += `<div class="slider-wrap"><input type="range" min="0" max="5" value="${v}" oninput="data['${selectedCountry}'].scores['${t.id}']=parseInt(this.value);this.nextElementSibling.textContent=this.value;updateSliderColor(this)" style="background:linear-gradient(to right,#c4956a ${(v/5)*100}%,#2a2420 ${(v/5)*100}%)"><span class="slider-val" style="color:${v>0?'#c4956a':'#5a524a'}">${v}</span></div></div>`;
  });
  html += '</div>';

  // Actor involvement
  html += '<div class="card"><h3 class="card-title">Actor involvement (0\u20135)</h3>';
  ACTORS.forEach(a => {
    const v = c.actors[a.id];
    html += `<div class="slider-row"><label><span><span class="actor-dot" style="background:${a.color}"></span>${a.label}</span></label>`;
    html += `<div class="slider-wrap"><input type="range" min="0" max="5" value="${v}" oninput="data['${selectedCountry}'].actors['${a.id}']=parseInt(this.value);this.nextElementSibling.textContent=this.value;updateSliderColor(this)" style="background:linear-gradient(to right,#c4956a ${(v/5)*100}%,#2a2420 ${(v/5)*100}%)"><span class="slider-val" style="color:${v>0?'#c4956a':'#5a524a'}">${v}</span></div></div>`;
  });
  html += '</div></div>';

  // Outcome + Notes
  html += '<div class="grid-2" style="margin-top:20px">';
  html += '<div class="card"><h3 class="card-title">Outcome classification</h3>';
  OUTCOMES.forEach(o => {
    const active = c.outcome === o.id;
    html += `<button class="outcome-btn" style="border-color:${active?o.color:'#3a342e'};background:${active?o.color+'22':'transparent'};color:${active?o.color:'#8a7e70'}" onclick="data['${selectedCountry}'].outcome='${o.id}';render()">${o.label}</button>`;
  });
  html += '</div>';

  html += '<div class="card"><h3 class="card-title">Analytical notes</h3>';
  html += `<textarea class="notes-area" oninput="data['${selectedCountry}'].notes=this.value" placeholder="Key context, causal mechanisms, counterfactuals...">${c.notes}</textarea></div></div>`;

// Summary stats
const wt = weightedTotal(selectedCountry);
const at = actorTotal(selectedCountry);
const da = dominantActor(selectedCountry);
html += ‘<div class="stat-row">’;
html += `<div class="stat-box"><div class="stat-label">Weighted intervention</div><div class="stat-value">${wt.toFixed(1)}</div></div>`;
html += `<div class="stat-box"><div class="stat-label">Actor involvement</div><div class="stat-value">${at}</div></div>`;
html += `<div class="stat-box"><div class="stat-label">Dominant actor</div><div class="stat-value" style="font-size:14px">${da}</div></div>`;
html += `<div class="stat-box"><div class="stat-label">Outcome</div><div>${badgeHTML(c.outcome)}</div></div>`;
html += ‘</div>’;

document.getElementById(‘view-country’).innerHTML = html;
}

function renderCorrelation() {
const points = COUNTRIES.map(c => ({
…c,
intervention: weightedTotal(c.id),
actorInvolvement: actorTotal(c.id),
outcome: data[c.id]?.outcome,
outcomeValue: OUTCOMES.find(o => o.id === data[c.id]?.outcome)?.value || 0,
}));

let html = ‘<div class="card"><h3 class="card-title">Intervention intensity vs. outcome quality</h3>’;
html += ‘<p style="font-size:13px;color:#8a7e70;margin:0 0 16px">X-axis: weighted intervention score. Y-axis: outcome (4 = democratic transition, 1 = state collapse). Bubble size = total actor involvement.</p>’;
html += ‘<div class="scatter-container">’;

// Y-axis labels
const outReversed = […OUTCOMES].reverse();
outReversed.forEach((o, i) => {
html += `<div class="scatter-ylabel" style="top:${(i/4)*100+6}%;color:${o.color}">${o.label}</div>`;
});

// Grid lines
[1,2,3,4].forEach(y => {
html += `<div class="scatter-gridline" style="top:${((4-y)/3)*70+15}%"></div>`;
});

// Points
points.forEach(c => {
const xPct = 14 + (c.intervention / 5) * 78;
const yPct = ((4 - c.outcomeValue) / 3) * 70 + 15;
const size = 20 + c.actorInvolvement * 2.5;
const oColor = OUTCOMES.find(o => o.id === c.outcome)?.color || ‘#8a7e70’;
html += `<div class="scatter-point" style="left:${xPct}%;top:${yPct}%;width:${size}px;height:${size}px;background:${oColor}44;border:2px solid ${oColor}" title="${c.name}: intervention ${c.intervention.toFixed(1)}, actors ${c.actorInvolvement}"><span style="font-size:${Math.max(10,size*0.4)}px">${c.flag}</span></div>`;
});

html += ‘<div class="scatter-xlabel">\u2190 Low intervention    Weighted intervention score    High intervention \u2192</div>’;
html += ‘</div></div>’;

// Patterns
const sorted = […points].sort((a, b) => b.intervention - a.intervention);
const highInt = sorted.filter(c => c.intervention >= 3);
const lowInt = sorted.filter(c => c.intervention < 2);

html += ‘<div class="card analysis" style="margin-top:20px"><h3 class="card-title">Key patterns</h3>’;
html += `<p><strong>High intervention (${highInt.map(c=>c.name).join(', ')}):</strong> ${highInt.every(c=>c.outcomeValue<=2) ? 'All produced state collapse or authoritarian restoration \u2014 suggesting heavy external involvement correlates with worse outcomes.' : 'Mixed outcomes despite heavy involvement.'}</p>`;
html += `<p><strong>Low intervention (${lowInt.map(c=>c.name).join(', ')}):</strong> ${lowInt.every(c=>c.outcomeValue>=3) ? 'All achieved partial reform or democratic transition \u2014 suggesting less external interference correlates with better outcomes.' : 'Mixed results even with minimal foreign involvement.'}</p>`;
html += ‘<p><strong>Dominant actor analysis:</strong> Countries where Saudi Arabia/UAE scored highest tended toward authoritarian restoration. Countries where Russia/Iran scored highest saw prolonged conflict. The single democratic transition case (Tunisia) had no dominant external actor.</p>’;
html += ‘</div>’;

// Ranked table
html += ‘<div class="card" style="margin-top:20px"><h3 class="card-title">Ranked by intervention intensity</h3>’;
html += ‘<table><thead><tr><th class="left">Rank</th><th class="left">Country</th><th>Intervention</th><th>Actor inv.</th><th>Outcome</th></tr></thead><tbody>’;
sorted.forEach((c, i) => {
html += `<tr><td class="left mono" style="color:#5a524a">${i+1}</td><td class="left" style="font-weight:600">${c.flag} ${c.name}</td><td class="mono" style="font-weight:700;color:#c4956a">${c.intervention.toFixed(1)}</td><td class="mono">${c.actorInvolvement}</td><td>${badgeHTML(c.outcome)}</td></tr>`;
});
html += ‘</tbody></table></div>’;

document.getElementById(‘view-correlation’).innerHTML = html;
}

function updateSliderColor(el) {
const pct = (el.value / el.max) * 100;
el.style.background = `linear-gradient(to right, #c4956a ${pct}%, #2a2420 ${pct}%)`;
const valSpan = el.nextElementSibling;
valSpan.style.color = parseInt(el.value) > 0 ? ‘#c4956a’ : ‘#5a524a’;
}

render();
</script>

</body>
